<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1080px; background: #050506; overflow: hidden; color: #F4F1E8;">

  <img src="bg_crop.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.9;">

  <!-- soft bottom scrim for legibility -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,6,0) 38%, rgba(5,5,6,0.55) 62%, rgba(5,5,6,0.92) 88%);"></div>

  <!-- content -->
  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 90px 78px 90px;">

    <div style="display: inline-flex; align-self: flex-start; align-items: center; border: 1px solid rgba(244,241,232,0.4); border-radius: 999px; padding: 8px 18px; margin-bottom: 26px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #F4F1E8;">7 de Setembro</span>
    </div>

    <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-size: 32px; line-height: 1.15; color: #E7E2D3; margin-bottom: 2px;">
      A todos um feliz
    </div>
    <h1 style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 76px; line-height: 1.02; margin: 0 0 26px 0; color: #FBFAF6; text-wrap: balance;">
      Dia da Independência
    </h1>

    <div style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 300; font-size: 19px; color: #B9C2CC; margin-bottom: 48px; max-width: 520px;">
      Liberdade que a gente ajuda a proteger, todos os dias.
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="logo_icon_flag.png" alt="" style="width: 52px; height: 52px; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-weight: 800; font-size: 18px; letter-spacing: 0.4px; text-transform: uppercase; color: #FBFAF6; line-height: 1;">
          Gestão de Riscos
        </div>
        <div style="font-size: 12.5px; font-weight: 500; color: #9FB0C3; letter-spacing: 0.2px;">
          Corretora de Seguros
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
