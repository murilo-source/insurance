<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #C9A227; }
    a:hover { color: #E0BC4B; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1080px; background: #0B1E3A; overflow: hidden; color: #F4F1E8;">

  <!-- large diamond motif referencing the flag, bleeding off the bottom-right -->
  <div style="position: absolute; width: 980px; height: 980px; right: -420px; bottom: -420px; background: #12406B; transform: rotate(45deg); border-radius: 24px;"></div>
  <div style="position: absolute; width: 760px; height: 760px; right: -310px; bottom: -310px; background: #0E3F27; transform: rotate(45deg); border-radius: 20px; opacity: 0.9;"></div>
  <div style="position: absolute; width: 420px; height: 420px; right: -140px; bottom: -140px; background: #C9A227; transform: rotate(45deg); border-radius: 14px; opacity: 0.16;"></div>

  <!-- content column -->
  <div style="position: relative; height: 100%; display: flex; flex-direction: column; padding: 88px 88px 72px 88px;">

    <!-- eyebrow -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 34px; height: 6px; background: #0E9A4B;"></div>
        <div style="width: 34px; height: 6px; background: #C9A227;"></div>
        <span style="font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #C9A227;">7 de Setembro</span>
      </div>
    </div>

    <!-- headline -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 760px; margin-top: 24px;">
      <h1 style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 68px; line-height: 1.12; margin: 0 0 28px 0; color: #FBFAF6;">
        A liberdade também se constrói com proteção.
      </h1>
      <p style="font-size: 22px; line-height: 1.6; margin: 0; max-width: 620px; color: #C9D2DE; font-weight: 400;">
        Neste Dia da Independência, celebramos quem tem coragem de seguir em frente. E lembramos que toda conquista duradoura se apoia em segurança e planejamento.
      </p>
    </div>

    <!-- divider -->
    <div style="width: 100%; height: 1px; background: rgba(244,241,232,0.16); margin: 40px 0 32px 0;"></div>

    <!-- footer / brand -->
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <img src="logo_icon_flag.png" alt="" style="width: 76px; height: 76px; flex-shrink: 0;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-family: 'Inter', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.5px; text-transform: uppercase; color: #FBFAF6; line-height: 1;">
            Gestão de Riscos
          </div>
          <div style="font-size: 15px; font-weight: 500; color: #9FB0C3; letter-spacing: 0.3px;">
            Corretora de Seguros &middot; Proteção que dá liberdade para crescer
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
