<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1080px; background: #0B1E3A; overflow: hidden; color: #F4F1E8;">

  <!-- motivo em losango: cor 1 fixa (azul da marca), cor 2 e cor 3 ajustáveis por data -->
  <div style="position: absolute; width: 980px; height: 980px; right: -420px; bottom: -420px; background: #12406B; transform: rotate(45deg); border-radius: 24px;"></div>
  <div style="position: absolute; width: 760px; height: 760px; right: -310px; bottom: -310px; background: {{colorMid}}; transform: rotate(45deg); border-radius: 20px;"></div>
  <div style="position: absolute; width: 420px; height: 420px; right: -140px; bottom: -140px; background: {{colorAccent}}; transform: rotate(45deg); border-radius: 14px; opacity: 0.85;"></div>

  <!-- content -->
  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 88px 76px 88px;">

    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 24px;">
      <div style="width: 34px; height: 6px; background: {{colorMid}};"></div>
      <div style="width: 34px; height: 6px; background: {{colorAccent}};"></div>
      <span style="font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #FBFAF6;">{{eyebrowLabel}}</span>
    </div>

    <div style="font-weight: 500; font-size: 34px; line-height: 1.1; color: #E7E2D3; margin-bottom: 2px;">
      {{headlineSetup}}
    </div>
    <h1 style="font-weight: 900; font-size: 92px; line-height: 0.96; margin: 0 0 28px 0; color: #FBFAF6; text-transform: uppercase; letter-spacing: -0.01em; text-wrap: balance;">
      {{headlineMain}}
    </h1>

    <div style="font-weight: 500; font-size: 19px; color: #C9D2DE; margin-bottom: 46px; max-width: 540px;">
      {{subtitle}}
    </div>

    <div style="width: 100%; height: 1px; background: rgba(244,241,232,0.2); margin-bottom: 32px;"></div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="logo_icon_flag.png" alt="" style="width: 56px; height: 56px; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-weight: 800; font-size: 19px; letter-spacing: 0.4px; text-transform: uppercase; color: #FBFAF6; line-height: 1;">
          Gestão de Riscos
        </div>
        <div style="font-size: 13px; font-weight: 500; color: #9FB0C3; letter-spacing: 0.2px;">
          Corretora de Seguros
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{
  "eyebrowLabel": {"editor": "text", "default": "7 DE SETEMBRO", "section": "Texto"},
  "headlineSetup": {"editor": "text", "default": "Feliz Dia da", "section": "Texto"},
  "headlineMain": {"editor": "text", "default": "Independência", "section": "Texto"},
  "subtitle": {"editor": "text", "default": "Liberdade que a gente ajuda a proteger, todos os dias.", "section": "Texto"},
  "colorMid": {"editor": "color", "default": "#0E7C41", "options": ["#0E7C41", "#7A1F2B", "#8A5A2B", "#5B3A8A"], "section": "Cor da data"},
  "colorAccent": {"editor": "color", "default": "#E7B94A", "options": ["#E7B94A", "#C9A227", "#D68A3C", "#B0B7C0"], "section": "Cor da data"}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      eyebrowLabel: this.props.eyebrowLabel ?? '7 DE SETEMBRO',
      headlineSetup: this.props.headlineSetup ?? 'Feliz Dia da',
      headlineMain: this.props.headlineMain ?? 'Independência',
      subtitle: this.props.subtitle ?? 'Liberdade que a gente ajuda a proteger, todos os dias.',
      colorMid: this.props.colorMid ?? '#0E7C41',
      colorAccent: this.props.colorAccent ?? '#E7B94A',
    };
  }
}
</script>
</body>
</html>
